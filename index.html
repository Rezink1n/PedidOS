<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lista Cafetería ☕</title>
  <meta name="description" content="Lista de compras para cafetería" />
  <meta name="theme-color" content="#f97316" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Lista Café" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:          #fafaf8;
      --bg2:         #ffffff;
      --bg3:         #f3f2ee;
      --card:        #ffffff;
      --card2:       #f5f4f0;
      --border:      #e5e3dc;
      --border2:     #d0cec5;
      --orange:      #f97316;
      --orange2:     #ea580c;
      --orange-light:#fff7ed;
      --text:        #1c1917;
      --text2:       #57534e;
      --text3:       #a8a29e;
      --red:         #ef4444;
      --red-bg:      #fef2f2;
      --green:       #16a34a;
      --radius:      14px;
      --radius-sm:   8px;
      --shadow:      0 1px 4px rgba(0,0,0,0.07), 0 4px 16px rgba(0,0,0,0.04);
      --shadow-sm:   0 1px 3px rgba(0,0,0,0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Header */
    header {
      padding: 18px 18px 0;
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .logo { display: flex; align-items: center; gap: 10px; }

    .logo-icon {
      width: 40px; height: 40px;
      background: var(--orange);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      box-shadow: 0 2px 8px rgba(249,115,22,0.35);
    }

    .logo h1 {
      font-family: 'Syne', sans-serif;
      font-size: 18px; font-weight: 800;
      color: var(--text); letter-spacing: -0.4px;
    }

    .logo p { font-size: 11px; color: var(--text3); margin-top: -1px; text-transform: capitalize; }

    .header-actions { display: flex; gap: 8px; }

    .btn-icon {
      width: 38px; height: 38px;
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: var(--text2);
      transition: all 0.15s;
      box-shadow: var(--shadow-sm);
    }
    .btn-icon:active { transform: scale(0.9); background: var(--card2); }

    /* Stats */
    .stats-bar { display: flex; gap: 8px; margin-bottom: 14px; }

    .stat-chip {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 10px; text-align: center;
      box-shadow: var(--shadow-sm);
    }

    .stat-chip .num {
      font-family: 'Syne', sans-serif;
      font-size: 22px; font-weight: 800;
      color: var(--orange); line-height: 1;
    }

    .stat-chip .lbl {
      font-size: 10px; color: var(--text3);
      text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px;
    }

    /* Filter tabs */
    .filter-tabs {
      display: flex; gap: 6px;
      overflow-x: auto; padding-bottom: 14px;
      scrollbar-width: none;
    }
    .filter-tabs::-webkit-scrollbar { display: none; }

    .tab {
      flex-shrink: 0;
      padding: 6px 14px; border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card); color: var(--text2);
      font-size: 12px; font-family: 'DM Sans', sans-serif;
      cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .tab.active { background: var(--orange); border-color: var(--orange); color: white; font-weight: 600; }

    /* Main */
    main { flex: 1; padding: 12px 16px 100px; overflow-y: auto; }

    /* Category */
    .category-section { margin-bottom: 6px; }

    .category-header {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 2px 6px;
      cursor: pointer; user-select: none;
    }

    .cat-icon {
      font-size: 15px; width: 28px; height: 28px;
      background: var(--orange-light);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }

    .cat-name {
      font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700;
      color: var(--text2); text-transform: uppercase; letter-spacing: 0.8px; flex: 1;
    }

    .cat-count {
      font-size: 11px; color: var(--text3);
      background: var(--bg3); padding: 2px 8px;
      border-radius: 999px; border: 1px solid var(--border);
    }

    .cat-toggle { color: var(--text3); font-size: 11px; transition: transform 0.2s; }
    .cat-toggle.collapsed { transform: rotate(-90deg); }

    /* Product item */
    .product-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px; margin-bottom: 6px;
      display: flex; align-items: center; gap: 12px;
      transition: all 0.2s; animation: slideIn 0.2s ease;
      box-shadow: var(--shadow-sm);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .product-item.marcado {
      background: var(--bg3); border-color: var(--border); box-shadow: none;
    }

    .product-item.marcado .prod-name { text-decoration: line-through; color: var(--text3); }

    .check-btn {
      width: 24px; height: 24px; border-radius: 50%;
      border: 2px solid var(--border2); background: transparent;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all 0.15s; font-size: 12px; color: transparent;
    }
    .product-item.marcado .check-btn { background: var(--green); border-color: var(--green); color: white; }
    .check-btn:active { transform: scale(0.85); }

    .prod-info { flex: 1; min-width: 0; }

    .prod-name {
      font-size: 15px; font-weight: 500; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .prod-meta { display: flex; gap: 6px; margin-top: 2px; align-items: center; }

    .prod-qty  { font-size: 12px; color: var(--orange2); font-weight: 600; }
    .prod-notes {
      font-size: 11px; color: var(--text3); font-style: italic;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px;
    }

    .prod-actions { display: flex; gap: 4px; }

    .prod-btn {
      width: 30px; height: 30px; border: none;
      background: var(--bg3); border-radius: 8px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; transition: all 0.15s;
    }
    .prod-btn:active { transform: scale(0.85); }
    .prod-btn.del  { color: var(--red); }
    .prod-btn.edit { color: var(--orange2); }

    /* Empty */
    .empty-state { text-align: center; padding: 60px 20px; }
    .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; line-height: 1.7; color: var(--text2); }

    /* FAB */
    .fab {
      position: fixed; bottom: 24px; right: 20px; z-index: 200;
      width: 56px; height: 56px;
      background: var(--orange); border: none; border-radius: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; color: white;
      box-shadow: 0 8px 24px rgba(249,115,22,0.45);
      transition: all 0.2s;
    }
    .fab:active { transform: scale(0.91); }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(28,25,23,0.45);
      backdrop-filter: blur(4px);
      z-index: 300;
      display: flex; align-items: flex-end; justify-content: center;
      animation: fadeIn 0.2s ease;
    }
    .modal-overlay.hidden { display: none; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 24px 24px 0 0;
      padding: 20px 20px 40px;
      width: 100%; max-width: 480px;
      animation: slideUp 0.25s ease;
      max-height: 90vh; overflow-y: auto;
      box-shadow: 0 -4px 40px rgba(0,0,0,0.1);
    }
    @keyframes slideUp {
      from { transform: translateY(60px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .modal-handle {
      width: 36px; height: 4px;
      background: var(--border2); border-radius: 2px;
      margin: 0 auto 18px;
    }

    .modal h2 {
      font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800;
      color: var(--text); margin-bottom: 18px;
    }

    /* Form */
    .form-group { margin-bottom: 13px; }

    label {
      display: block; font-size: 11px; font-weight: 600;
      color: var(--text3); text-transform: uppercase;
      letter-spacing: 0.8px; margin-bottom: 5px;
    }

    input, select, textarea {
      width: 100%;
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 11px 13px; color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 15px;
      outline: none; transition: border-color 0.15s, box-shadow 0.15s;
      -webkit-appearance: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(249,115,22,0.12);
      background: var(--card);
    }
    select option { background: white; color: var(--text); }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .btn-primary {
      width: 100%; padding: 13px;
      background: var(--orange); border: none;
      border-radius: var(--radius-sm); color: white;
      font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700;
      cursor: pointer; margin-top: 8px; transition: all 0.15s;
      box-shadow: 0 4px 12px rgba(249,115,22,0.3);
    }
    .btn-primary:active { transform: scale(0.97); background: var(--orange2); }

    .btn-secondary {
      width: 100%; padding: 11px;
      background: transparent; border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text2);
      font-family: 'DM Sans', sans-serif; font-size: 14px;
      cursor: pointer; margin-top: 8px; transition: all 0.15s;
    }
    .btn-secondary:active { transform: scale(0.97); background: var(--bg3); }

    /* Share */
    .share-preview {
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 14px;
      font-size: 13px; line-height: 1.8; color: var(--text2);
      white-space: pre-wrap; max-height: 240px; overflow-y: auto;
      margin-bottom: 14px;
    }

    .share-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .btn-whatsapp {
      padding: 13px; background: #25d366; border: none;
      border-radius: var(--radius-sm); color: white;
      font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: all 0.15s;
    }
    .btn-whatsapp:active { transform: scale(0.97); }

    .btn-copy {
      padding: 13px; background: var(--bg3); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--orange2);
      font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: all 0.15s;
    }
    .btn-copy:active { transform: scale(0.97); }

    /* Toast */
    .toast {
      position: fixed; bottom: 90px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--text); color: white;
      padding: 10px 20px; border-radius: 999px;
      font-size: 13px; font-weight: 500;
      z-index: 500; opacity: 0; transition: all 0.3s;
      pointer-events: none; white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Loading */
    .loading {
      display: flex; justify-content: center; align-items: center;
      padding: 50px; color: var(--text3); font-size: 13px; gap: 8px;
    }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--border); border-top-color: var(--orange);
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Offline */
    .offline-banner {
      background: #fef2f2; color: var(--red);
      border-bottom: 1px solid #fecaca;
      text-align: center; padding: 7px;
      font-size: 12px; font-weight: 500; display: none;
    }
    .offline-banner.show { display: block; }

    .delete-all-btn {
      padding: 11px 16px; background: var(--red-bg);
      border: 1px solid #fecaca; border-radius: var(--radius-sm);
      color: var(--red); font-size: 13px; cursor: pointer;
      margin-top: 8px; width: 100%; font-family: 'DM Sans', sans-serif;
    }
    .delete-all-btn:active { opacity: 0.8; }
  </style>
</head>
<body>

  <div class="offline-banner" id="offlineBanner">📶 Sin conexión — datos del caché</div>

  <header>
    <div class="header-top">
      <div class="logo">
        <div class="logo-icon">☕</div>
        <div>
          <h1>Lista Cafetería</h1>
          <p id="fechaHoy"></p>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-icon" onclick="abrirCompartir()" title="Compartir lista">📤</button>
        <button class="btn-icon" onclick="abrirConfig()" title="Opciones">⚙️</button>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat-chip">
        <div class="num" id="statTotal">0</div>
        <div class="lbl">Total</div>
      </div>
      <div class="stat-chip">
        <div class="num" id="statPendiente">0</div>
        <div class="lbl">Pendientes</div>
      </div>
      <div class="stat-chip">
        <div class="num" id="statListo">0</div>
        <div class="lbl">Listos ✓</div>
      </div>
    </div>

    <div class="filter-tabs" id="filterTabs">
      <button class="tab active" data-filter="todos" onclick="setFiltro('todos', this)">Todos</button>
      <button class="tab" data-filter="pendientes" onclick="setFiltro('pendientes', this)">Pendientes</button>
      <button class="tab" data-filter="marcados" onclick="setFiltro('marcados', this)">Marcados</button>
    </div>
  </header>

  <main id="mainContent">
    <div class="loading"><div class="spinner"></div> Cargando lista...</div>
  </main>

  <button class="fab" onclick="abrirModal()" title="Agregar producto">+</button>

  <!-- Modal agregar/editar -->
  <div class="modal-overlay hidden" id="modalProducto">
    <div class="modal">
      <div class="modal-handle"></div>
      <h2 id="modalTitulo">Agregar Producto</h2>
      <input type="hidden" id="editId" value="" />
      <div class="form-group">
        <label>Nombre del producto *</label>
        <input type="text" id="inputNombre" placeholder="Ej: Leche entera" autocomplete="off" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Cantidad</label>
          <input type="text" id="inputCantidad" placeholder="Ej: 2, 500" />
        </div>
        <div class="form-group">
          <label>Unidad</label>
          <input type="text" id="inputUnidad" placeholder="Ej: kg, L, pzas" />
        </div>
      </div>
      <div class="form-group">
        <label>Categoría</label>
        <select id="selectCategoria">
          <option value="">Sin categoría</option>
        </select>
      </div>
      <div class="form-group">
        <label>Notas</label>
        <input type="text" id="inputNotas" placeholder="Ej: Marca específica, urgente..." />
      </div>
      <button class="btn-primary" onclick="guardarProducto()">✓ Guardar Producto</button>
      <button class="btn-secondary" onclick="cerrarModal('modalProducto')">Cancelar</button>
    </div>
  </div>

  <!-- Modal compartir -->
  <div class="modal-overlay hidden" id="modalCompartir">
    <div class="modal">
      <div class="modal-handle"></div>
      <h2>📤 Compartir Lista</h2>
      <div class="share-preview" id="sharePreview"></div>
      <div class="share-actions">
        <button class="btn-whatsapp" onclick="compartirWhatsApp()">💬 WhatsApp</button>
        <button class="btn-copy" onclick="copiarTexto()">📋 Copiar</button>
      </div>
      <button class="btn-secondary" onclick="cerrarModal('modalCompartir')" style="margin-top:12px">Cerrar</button>
    </div>
  </div>

  <!-- Modal opciones -->
  <div class="modal-overlay hidden" id="modalConfig">
    <div class="modal">
      <div class="modal-handle"></div>
      <h2>⚙️ Opciones</h2>
      <p style="font-size:13px;color:var(--text3);margin-bottom:16px;">Gestiona tu lista del día.</p>
      <button class="btn-secondary" onclick="desmarcarTodos()">↩ Desmarcar todos los productos</button>
      <button class="delete-all-btn" onclick="eliminarMarcados()">🗑 Eliminar solo los marcados</button>
      <button class="btn-secondary" onclick="cerrarModal('modalConfig')" style="margin-top:14px">Cerrar</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ─── SUPABASE ───────────────────────────────────────────────────────────
    const SUPABASE_URL = 'https://svrflyktvdwgjiksumze.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_5bG4hUoOQQyYMbsTV02nMw_DxuVQYKt';

    const headers = {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Prefer': 'return=representation'
    };

    const api = async (method, path, body) => {
      const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
        method, headers, ...(body ? { body: JSON.stringify(body) } : {})
      });
      if (!r.ok) throw new Error(await r.text());
      return method === 'DELETE' ? null : r.json();
    };

    const sbGet    = (t, q='') => api('GET',    `${t}${q}`);
    const sbPost   = (t, d)    => api('POST',   t, d);
    const sbPatch  = (t, id, d)=> api('PATCH',  `${t}?id=eq.${id}`, d);
    const sbDelete = (t, id)   => api('DELETE', `${t}?id=eq.${id}`);

    // ─── STATE ──────────────────────────────────────────────────────────────
    let categorias = [], productos = [];
    let filtroActual = 'todos';
    let categoriasColapsadas = new Set();

    // ─── INIT ───────────────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('fechaHoy').textContent =
        new Date().toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long' });
      window.addEventListener('offline', () => document.getElementById('offlineBanner').classList.add('show'));
      window.addEventListener('online',  () => document.getElementById('offlineBanner').classList.remove('show'));
      await cargarDatos();
    });

    async function cargarDatos() {
      try {
        [categorias, productos] = await Promise.all([
          sbGet('categorias', '?order=orden.asc'),
          sbGet('productos',  '?order=orden.asc,created_at.desc')
        ]);
        poblarSelectCategorias();
        renderLista();
      } catch (e) {
        document.getElementById('mainContent').innerHTML =
          `<div class="empty-state"><div class="empty-icon">⚠️</div><p>Error cargando datos.<br>Verifica tu conexión.</p></div>`;
      }
    }

    function poblarSelectCategorias() {
      const sel = document.getElementById('selectCategoria');
      const cur = sel.value;
      sel.innerHTML = '<option value="">Sin categoría</option>';
      categorias.forEach(c => sel.innerHTML += `<option value="${c.id}">${c.icono} ${c.nombre}</option>`);
      sel.value = cur;

      const tabs = document.getElementById('filterTabs');
      tabs.querySelectorAll('[data-cat]').forEach(t => t.remove());
      categorias.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'tab';
        btn.dataset.filter = 'cat_' + c.id;
        btn.dataset.cat = c.id;
        btn.textContent = `${c.icono} ${c.nombre}`;
        btn.onclick = () => setFiltro('cat_' + c.id, btn);
        tabs.appendChild(btn);
      });
    }

    // ─── RENDER ─────────────────────────────────────────────────────────────
    function renderLista() {
      const main = document.getElementById('mainContent');
      let pf = [...productos];
      if (filtroActual === 'pendientes')        pf = pf.filter(p => !p.marcado);
      else if (filtroActual === 'marcados')     pf = pf.filter(p =>  p.marcado);
      else if (filtroActual.startsWith('cat_')) pf = pf.filter(p => p.categoria_id === filtroActual.slice(4));

      document.getElementById('statTotal').textContent     = productos.length;
      document.getElementById('statPendiente').textContent = productos.filter(p => !p.marcado).length;
      document.getElementById('statListo').textContent     = productos.filter(p =>  p.marcado).length;

      if (!pf.length) {
        main.innerHTML = `<div class="empty-state">
          <div class="empty-icon">${filtroActual === 'todos' ? '🛒' : '✅'}</div>
          <p>${filtroActual === 'todos' ? 'La lista está vacía.<br>Toca <strong>+</strong> para agregar productos.' : 'No hay productos aquí.'}</p>
        </div>`;
        return;
      }

      const sinCat = { id: null, nombre: 'Sin categoría', icono: '📦' };
      const grupos = {};
      pf.forEach(p => {
        const key = p.categoria_id || 'none';
        if (!grupos[key]) grupos[key] = { cat: categorias.find(c => c.id === p.categoria_id) || sinCat, items: [] };
        grupos[key].items.push(p);
      });

      main.innerHTML = Object.entries(grupos).map(([catId, g]) => {
        const col = categoriasColapsadas.has(catId);
        return `<div class="category-section">
          <div class="category-header" onclick="toggleCategoria('${catId}')">
            <div class="cat-icon">${g.cat.icono}</div>
            <span class="cat-name">${g.cat.nombre}</span>
            <span class="cat-count">${g.items.filter(p=>!p.marcado).length}/${g.items.length}</span>
            <span class="cat-toggle ${col ? 'collapsed' : ''}">▼</span>
          </div>
          ${col ? '' : g.items.map(renderProducto).join('')}
        </div>`;
      }).join('');
    }

    function renderProducto(p) {
      const qty   = p.cantidad ? `<span class="prod-qty">${p.cantidad}${p.unidad ? ' ' + p.unidad : ''}</span>` : '';
      const notas = p.notas   ? `<span class="prod-notes">· ${p.notas}</span>` : '';
      return `<div class="product-item ${p.marcado ? 'marcado' : ''}">
        <button class="check-btn" onclick="toggleMarcado('${p.id}')">${p.marcado ? '✓' : ''}</button>
        <div class="prod-info">
          <div class="prod-name">${esc(p.nombre)}</div>
          <div class="prod-meta">${qty}${notas}</div>
        </div>
        <div class="prod-actions">
          <button class="prod-btn edit" onclick="editarProducto('${p.id}')">✏️</button>
          <button class="prod-btn del"  onclick="eliminarProducto('${p.id}')">🗑</button>
        </div>
      </div>`;
    }

    const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

    function toggleCategoria(id) {
      categoriasColapsadas.has(id) ? categoriasColapsadas.delete(id) : categoriasColapsadas.add(id);
      renderLista();
    }

    function setFiltro(f, btn) {
      filtroActual = f;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      renderLista();
    }

    // ─── ACCIONES ───────────────────────────────────────────────────────────
    async function toggleMarcado(id) {
      const p = productos.find(x => x.id === id);
      if (!p) return;
      p.marcado = !p.marcado;
      renderLista();
      try { await sbPatch('productos', id, { marcado: p.marcado }); }
      catch { p.marcado = !p.marcado; renderLista(); mostrarToast('Error al guardar'); }
    }

    async function eliminarProducto(id) {
      if (!confirm('¿Eliminar este producto?')) return;
      const idx = productos.findIndex(x => x.id === id);
      const bak = productos[idx];
      productos.splice(idx, 1); renderLista();
      try { await sbDelete('productos', id); mostrarToast('Producto eliminado'); }
      catch { productos.splice(idx, 0, bak); renderLista(); mostrarToast('Error al eliminar'); }
    }

    function editarProducto(id) {
      const p = productos.find(x => x.id === id); if (!p) return;
      document.getElementById('editId').value          = p.id;
      document.getElementById('modalTitulo').textContent = 'Editar Producto';
      document.getElementById('inputNombre').value     = p.nombre;
      document.getElementById('inputCantidad').value   = p.cantidad || '';
      document.getElementById('inputUnidad').value     = p.unidad   || '';
      document.getElementById('selectCategoria').value = p.categoria_id || '';
      document.getElementById('inputNotas').value      = p.notas    || '';
      abrirModal();
    }

    // ─── CRUD MODAL ─────────────────────────────────────────────────────────
    function abrirModal() {
      document.getElementById('modalProducto').classList.remove('hidden');
      setTimeout(() => document.getElementById('inputNombre').focus(), 300);
    }

    function cerrarModal(id) {
      document.getElementById(id).classList.add('hidden');
      if (id === 'modalProducto') {
        ['editId','inputNombre','inputCantidad','inputUnidad','inputNotas'].forEach(i => document.getElementById(i).value = '');
        document.getElementById('selectCategoria').value = '';
        document.getElementById('modalTitulo').textContent = 'Agregar Producto';
      }
    }

    async function guardarProducto() {
      const nombre = document.getElementById('inputNombre').value.trim();
      if (!nombre) { mostrarToast('Escribe el nombre del producto'); return; }
      const editId = document.getElementById('editId').value;
      const data = {
        nombre,
        cantidad:     document.getElementById('inputCantidad').value.trim(),
        unidad:       document.getElementById('inputUnidad').value.trim(),
        categoria_id: document.getElementById('selectCategoria').value || null,
        notas:        document.getElementById('inputNotas').value.trim(),
        updated_at:   new Date().toISOString()
      };
      cerrarModal('modalProducto');
      try {
        if (editId) {
          await sbPatch('productos', editId, data);
          const idx = productos.findIndex(x => x.id === editId);
          if (idx >= 0) productos[idx] = { ...productos[idx], ...data };
          mostrarToast('✓ Producto actualizado');
        } else {
          const [nuevo] = await sbPost('productos', { ...data, marcado: false, orden: productos.length });
          productos.unshift(nuevo);
          mostrarToast('✓ Producto agregado');
        }
        renderLista();
      } catch (e) { mostrarToast('Error al guardar'); await cargarDatos(); }
    }

    // ─── COMPARTIR ──────────────────────────────────────────────────────────
    function generarTexto() {
      const hoy = new Date().toLocaleDateString('es-ES',
        { weekday:'long', day:'numeric', month:'long', year:'numeric' });
      let txt = `☕ *Lista Cafetería*\n📅 ${hoy}\n`;
      const pend = productos.filter(p => !p.marcado);
      const marc = productos.filter(p =>  p.marcado);
      if (!pend.length && !marc.length) return '☕ Lista vacía';
      if (pend.length) {
        const g = {};
        pend.forEach(p => {
          const c = categorias.find(x => x.id === p.categoria_id);
          const k = c ? c.nombre : 'Sin categoría';
          if (!g[k]) g[k] = { i: c?.icono || '📦', items: [] };
          g[k].items.push(p);
        });
        txt += `\n🛒 *PENDIENTES (${pend.length})*\n`;
        Object.entries(g).forEach(([k, v]) => {
          txt += `\n${v.i} *${k}*\n`;
          v.items.forEach(p => {
            txt += `• ${p.nombre}${p.cantidad ? ` — ${p.cantidad}${p.unidad ? ' '+p.unidad : ''}` : ''}${p.notas ? ` _(${p.notas})_` : ''}\n`;
          });
        });
      }
      if (marc.length) {
        txt += `\n✅ *YA TENEMOS (${marc.length})*\n`;
        marc.forEach(p => txt += `✓ ${p.nombre}\n`);
      }
      return txt + `\n_Generado con Lista Cafetería ☕_`;
    }

    function abrirCompartir() {
      document.getElementById('sharePreview').textContent = generarTexto();
      document.getElementById('modalCompartir').classList.remove('hidden');
    }

    function compartirWhatsApp() {
      window.open(`https://wa.me/?text=${encodeURIComponent(generarTexto())}`, '_blank');
    }

    async function copiarTexto() {
      const txt = generarTexto();
      try { await navigator.clipboard.writeText(txt); }
      catch { const ta = Object.assign(document.createElement('textarea'), { value: txt });
              document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
      mostrarToast('📋 Lista copiada');
    }

    // ─── OPCIONES ───────────────────────────────────────────────────────────
    function abrirConfig() { document.getElementById('modalConfig').classList.remove('hidden'); }

    async function desmarcarTodos() {
      if (!confirm('¿Desmarcar todos?')) return;
      cerrarModal('modalConfig');
      productos.forEach(p => p.marcado = false); renderLista();
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/productos`, { method:'PATCH', headers, body: JSON.stringify({ marcado: false }) });
        mostrarToast('↩ Todos desmarcados');
      } catch { await cargarDatos(); }
    }

    async function eliminarMarcados() {
      const m = productos.filter(p => p.marcado);
      if (!m.length) { mostrarToast('No hay productos marcados'); return; }
      if (!confirm(`¿Eliminar ${m.length} productos marcados?`)) return;
      cerrarModal('modalConfig');
      productos = productos.filter(p => !p.marcado); renderLista();
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/productos?marcado=eq.true`, { method:'DELETE', headers });
        mostrarToast(`🗑 ${m.length} productos eliminados`);
      } catch { await cargarDatos(); }
    }

    // ─── TOAST ──────────────────────────────────────────────────────────────
    function mostrarToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    // ─── CERRAR AL TOCAR AFUERA ──────────────────────────────────────────
    document.querySelectorAll('.modal-overlay').forEach(o =>
      o.addEventListener('click', e => { if (e.target === o) cerrarModal(o.id); })
    );

    document.getElementById('inputNombre').addEventListener('keydown', e => {
      if (e.key === 'Enter') guardarProducto();
    });

    // ─── SERVICE WORKER ──────────────────────────────────────────────────
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.error));
    }
  </script>
</body>
</html>
