<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lista Cafetería ☕</title>
  <meta name="description" content="Lista de compras para cafetería" />
  <meta name="theme-color" content="#1a0a00" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Lista Café" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0f0700;
      --bg2: #1a0d00;
      --bg3: #241200;
      --card: #1e1000;
      --card2: #2a1800;
      --border: #3d2200;
      --amber: #f59e0b;
      --amber2: #fbbf24;
      --amber-dim: #92400e;
      --cream: #fef3c7;
      --text: #fde68a;
      --text2: #d97706;
      --text3: #78350f;
      --red: #ef4444;
      --green: #10b981;
      --radius: 14px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--cream);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Grain texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 999;
      opacity: 0.3;
    }

    /* Header */
    header {
      padding: 20px 20px 0;
      position: sticky;
      top: 0;
      z-index: 100;
      background: linear-gradient(to bottom, var(--bg) 80%, transparent);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: var(--amber);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .logo h1 {
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: var(--amber2);
      letter-spacing: -0.5px;
    }

    .logo p {
      font-size: 11px;
      color: var(--text3);
      margin-top: -2px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn-icon {
      width: 38px;
      height: 38px;
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: var(--text);
      transition: all 0.15s;
    }
    .btn-icon:active { transform: scale(0.9); background: var(--card2); }

    /* Stats bar */
    .stats-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .stat-chip {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      text-align: center;
    }

    .stat-chip .num {
      font-family: 'Syne', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--amber);
      line-height: 1;
    }

    .stat-chip .lbl {
      font-size: 10px;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    /* Filter tabs */
    .filter-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 12px;
      scrollbar-width: none;
    }
    .filter-tabs::-webkit-scrollbar { display: none; }

    .tab {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text3);
      font-size: 12px;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .tab.active {
      background: var(--amber);
      border-color: var(--amber);
      color: var(--bg);
      font-weight: 600;
    }

    /* Main content */
    main {
      flex: 1;
      padding: 4px 16px 100px;
      overflow-y: auto;
    }

    /* Category section */
    .category-section {
      margin-bottom: 8px;
    }

    .category-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 4px 6px;
      cursor: pointer;
      user-select: none;
    }

    .cat-icon {
      font-size: 16px;
      width: 28px;
      height: 28px;
      background: var(--card);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cat-name {
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      flex: 1;
    }

    .cat-count {
      font-size: 11px;
      color: var(--text3);
      background: var(--card);
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    .cat-toggle {
      color: var(--text3);
      font-size: 12px;
      transition: transform 0.2s;
    }
    .cat-toggle.collapsed { transform: rotate(-90deg); }

    /* Product item */
    .product-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s;
      animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .product-item.marcado {
      opacity: 0.5;
      background: var(--bg3);
    }

    .product-item.marcado .prod-name {
      text-decoration: line-through;
      color: var(--text3);
    }

    /* Checkbox */
    .check-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
      font-size: 12px;
      color: transparent;
    }

    .product-item.marcado .check-btn {
      background: var(--green);
      border-color: var(--green);
      color: white;
    }

    .check-btn:active { transform: scale(0.85); }

    /* Product info */
    .prod-info { flex: 1; min-width: 0; }

    .prod-name {
      font-size: 15px;
      font-weight: 500;
      color: var(--cream);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .prod-meta {
      display: flex;
      gap: 6px;
      margin-top: 2px;
      align-items: center;
    }

    .prod-qty {
      font-size: 12px;
      color: var(--amber);
      font-weight: 600;
    }

    .prod-notes {
      font-size: 11px;
      color: var(--text3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 150px;
    }

    /* Product actions */
    .prod-actions {
      display: flex;
      gap: 4px;
    }

    .prod-btn {
      width: 30px;
      height: 30px;
      border: none;
      background: var(--bg3);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      transition: all 0.15s;
    }
    .prod-btn:active { transform: scale(0.85); }
    .prod-btn.del { color: var(--red); }
    .prod-btn.edit { color: var(--amber); }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text3);
    }

    .empty-state .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .empty-state p {
      font-size: 14px;
      line-height: 1.6;
    }

    /* FAB */
    .fab {
      position: fixed;
      bottom: 24px;
      right: 20px;
      z-index: 200;
      width: 56px;
      height: 56px;
      background: var(--amber);
      border: none;
      border-radius: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: var(--bg);
      box-shadow: 0 8px 24px rgba(245,158,11,0.4);
      transition: all 0.2s;
    }
    .fab:active { transform: scale(0.9); }

    /* Modal overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px);
      z-index: 300;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      animation: fadeIn 0.2s ease;
    }

    .modal-overlay.hidden { display: none; }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 24px 24px 0 0;
      padding: 24px 20px 40px;
      width: 100%;
      max-width: 480px;
      animation: slideUp 0.25s ease;
      max-height: 90vh;
      overflow-y: auto;
    }

    @keyframes slideUp {
      from { transform: translateY(60px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-handle {
      width: 36px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 20px;
    }

    .modal h2 {
      font-family: 'Syne', sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: var(--amber2);
      margin-bottom: 20px;
    }

    /* Form */
    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    input, select, textarea {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      color: var(--cream);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--amber);
    }

    select option { background: var(--bg2); color: var(--cream); }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--amber);
      border: none;
      border-radius: var(--radius-sm);
      color: var(--bg);
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.15s;
    }
    .btn-primary:active { transform: scale(0.97); }

    .btn-secondary {
      width: 100%;
      padding: 12px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text2);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      cursor: pointer;
      margin-top: 6px;
      transition: all 0.15s;
    }
    .btn-secondary:active { transform: scale(0.97); }

    /* Share modal */
    .share-preview {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px;
      font-size: 13px;
      line-height: 1.8;
      color: var(--text);
      white-space: pre-wrap;
      max-height: 260px;
      overflow-y: auto;
      margin-bottom: 14px;
      font-family: 'DM Sans', monospace;
    }

    .share-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-whatsapp {
      padding: 13px;
      background: #25d366;
      border: none;
      border-radius: var(--radius-sm);
      color: white;
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn-whatsapp:active { transform: scale(0.97); }

    .btn-copy {
      padding: 13px;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--amber);
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn-copy:active { transform: scale(0.97); }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--amber);
      color: var(--bg);
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      z-index: 500;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Loading */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
      color: var(--text3);
      font-size: 13px;
      gap: 8px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--amber);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Offline banner */
    .offline-banner {
      background: var(--red);
      color: white;
      text-align: center;
      padding: 6px;
      font-size: 12px;
      display: none;
    }
    .offline-banner.show { display: block; }

    /* Color dots for categories */
    .cat-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .delete-all-btn {
      padding: 10px 16px;
      background: transparent;
      border: 1px solid #7f1d1d;
      border-radius: var(--radius-sm);
      color: var(--red);
      font-size: 13px;
      cursor: pointer;
      margin-top: 8px;
      width: 100%;
    }

    .section-divider {
      height: 1px;
      background: var(--border);
      margin: 4px 0 12px;
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <div class="offline-banner" id="offlineBanner">📶 Sin conexión — cambios guardados localmente</div>

  <header>
    <div class="header-top">
      <div class="logo">
        <div class="logo-icon">☕</div>
        <div>
          <h1>Lista Cafetería</h1>
          <p id="fechaHoy"></p>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-icon" onclick="abrirCompartir()" title="Compartir lista">📤</button>
        <button class="btn-icon" onclick="abrirConfig()" title="Configuración">⚙️</button>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat-chip">
        <div class="num" id="statTotal">0</div>
        <div class="lbl">Total</div>
      </div>
      <div class="stat-chip">
        <div class="num" id="statPendiente">0</div>
        <div class="lbl">Pendientes</div>
      </div>
      <div class="stat-chip">
        <div class="num" id="statListo">0</div>
        <div class="lbl">Listos ✓</div>
      </div>
    </div>

    <div class="filter-tabs" id="filterTabs">
      <button class="tab active" data-filter="todos" onclick="setFiltro('todos', this)">Todos</button>
      <button class="tab" data-filter="pendientes" onclick="setFiltro('pendientes', this)">Pendientes</button>
      <button class="tab" data-filter="marcados" onclick="setFiltro('marcados', this)">Marcados</button>
    </div>
  </header>

  <main id="mainContent">
    <div class="loading"><div class="spinner"></div> Cargando lista...</div>
  </main>

  <button class="fab" onclick="abrirModal()" title="Agregar producto">+</button>

  <!-- Modal agregar/editar producto -->
  <div class="modal-overlay hidden" id="modalProducto">
    <div class="modal">
      <div class="modal-handle"></div>
      <h2 id="modalTitulo">Agregar Producto</h2>
      <input type="hidden" id="editId" value="" />
      <div class="form-group">
        <label>Nombre del producto *</label>
        <input type="text" id="inputNombre" placeholder="Ej: Leche entera" autocomplete="off" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Cantidad</label>
          <input type="text" id="inputCantidad" placeholder="Ej: 2, 500" />
        </div>
        <div class="form-group">
          <label>Unidad</label>
          <input type="text" id="inputUnidad" placeholder="Ej: kg, L, pzas" />
        </div>
      </div>
      <div class="form-group">
        <label>Categoría</label>
        <select id="selectCategoria">
          <option value="">Sin categoría</option>
        </select>
      </div>
      <div class="form-group">
        <label>Notas</label>
        <input type="text" id="inputNotas" placeholder="Ej: Marca específica, urgente..." />
      </div>
      <button class="btn-primary" onclick="guardarProducto()">✓ Guardar Producto</button>
      <button class="btn-secondary" onclick="cerrarModal('modalProducto')">Cancelar</button>
    </div>
  </div>

  <!-- Modal compartir -->
  <div class="modal-overlay hidden" id="modalCompartir">
    <div class="modal">
      <div class="modal-handle"></div>
      <h2>📤 Compartir Lista</h2>
      <div class="share-preview" id="sharePreview"></div>
      <div class="share-actions">
        <button class="btn-whatsapp" onclick="compartirWhatsApp()">
          <span>💬</span> WhatsApp
        </button>
        <button class="btn-copy" onclick="copiarTexto()">
          <span>📋</span> Copiar
        </button>
      </div>
      <button class="btn-secondary" onclick="cerrarModal('modalCompartir')" style="margin-top:12px">Cerrar</button>
    </div>
  </div>

  <!-- Modal config -->
  <div class="modal-overlay hidden" id="modalConfig">
    <div class="modal">
      <div class="modal-handle"></div>
      <h2>⚙️ Opciones</h2>
      <p style="font-size:13px;color:var(--text3);margin-bottom:16px;">Gestiona tu lista del día.</p>
      <button class="btn-secondary" onclick="desmarcarTodos()">↩ Desmarcar todos los productos</button>
      <button class="delete-all-btn" onclick="eliminarMarcados()">🗑 Eliminar solo los marcados</button>
      <button class="btn-secondary" onclick="cerrarModal('modalConfig')" style="margin-top:12px">Cerrar</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ─── CONFIG SUPABASE ────────────────────────────────────────────────────
    const SUPABASE_URL = 'https://gyyonylosfesuhcqtknr.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5eW9ueWxvc2Zlc3VoY3F0a25yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0Mjc5MzAsImV4cCI6MjA5MjAwMzkzMH0._zzxwJkMweRMx0KwyQJMPm8AIpVQRFiDmiHub11_aZ4';

    const headers = {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Prefer': 'return=representation'
    };

    async function sbGet(table, query = '') {
      const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}${query}`, { headers });
      if (!r.ok) throw new Error(await r.text());
      return r.json();
    }

    async function sbPost(table, data) {
      const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
        method: 'POST', headers, body: JSON.stringify(data)
      });
      if (!r.ok) throw new Error(await r.text());
      return r.json();
    }

    async function sbPatch(table, id, data) {
      const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, {
        method: 'PATCH', headers, body: JSON.stringify(data)
      });
      if (!r.ok) throw new Error(await r.text());
      return r.json();
    }

    async function sbDelete(table, id) {
      const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, {
        method: 'DELETE', headers
      });
      if (!r.ok) throw new Error(await r.text());
    }

    // ─── STATE ──────────────────────────────────────────────────────────────
    let categorias = [];
    let productos = [];
    let filtroActual = 'todos';
    let categoriasColapsadas = new Set();

    // ─── INIT ───────────────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', async () => {
      // Fecha
      const hoy = new Date();
      document.getElementById('fechaHoy').textContent =
        hoy.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });

      // Offline detection
      window.addEventListener('offline', () => document.getElementById('offlineBanner').classList.add('show'));
      window.addEventListener('online', () => document.getElementById('offlineBanner').classList.remove('show'));

      await cargarDatos();
    });

    async function cargarDatos() {
      try {
        categorias = await sbGet('categorias', '?order=orden.asc');
        productos = await sbGet('productos', '?order=orden.asc,created_at.desc');
        poblarSelectCategorias();
        renderLista();
      } catch (e) {
        console.error(e);
        document.getElementById('mainContent').innerHTML =
          `<div class="empty-state"><div class="empty-icon">⚠️</div><p>Error cargando datos.<br>Verifica tu conexión.</p></div>`;
      }
    }

    function poblarSelectCategorias() {
      const sel = document.getElementById('selectCategoria');
      const current = sel.value;
      sel.innerHTML = '<option value="">Sin categoría</option>';
      categorias.forEach(c => {
        sel.innerHTML += `<option value="${c.id}">${c.icono} ${c.nombre}</option>`;
      });
      sel.value = current;

      // También llenar filtros
      const tabs = document.getElementById('filterTabs');
      // Quitar tabs de categorías previas
      const oldCatTabs = tabs.querySelectorAll('[data-cat]');
      oldCatTabs.forEach(t => t.remove());
      categorias.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'tab';
        btn.dataset.filter = 'cat_' + c.id;
        btn.dataset.cat = c.id;
        btn.textContent = `${c.icono} ${c.nombre}`;
        btn.onclick = () => setFiltro('cat_' + c.id, btn);
        tabs.appendChild(btn);
      });
    }

    // ─── RENDER ─────────────────────────────────────────────────────────────
    function renderLista() {
      const main = document.getElementById('mainContent');

      let productosFiltrados = [...productos];
      if (filtroActual === 'pendientes') {
        productosFiltrados = productos.filter(p => !p.marcado);
      } else if (filtroActual === 'marcados') {
        productosFiltrados = productos.filter(p => p.marcado);
      } else if (filtroActual.startsWith('cat_')) {
        const catId = filtroActual.replace('cat_', '');
        productosFiltrados = productos.filter(p => p.categoria_id === catId);
      }

      // Actualizar stats
      document.getElementById('statTotal').textContent = productos.length;
      document.getElementById('statPendiente').textContent = productos.filter(p => !p.marcado).length;
      document.getElementById('statListo').textContent = productos.filter(p => p.marcado).length;

      if (productosFiltrados.length === 0) {
        main.innerHTML = `<div class="empty-state">
          <div class="empty-icon">${filtroActual === 'todos' ? '🛒' : '✅'}</div>
          <p>${filtroActual === 'todos' ? 'La lista está vacía.<br>Toca <strong>+</strong> para agregar productos.' : 'No hay productos aquí.'}</p>
        </div>`;
        return;
      }

      // Agrupar por categoría
      const grupos = {};
      const sinCat = { id: null, nombre: 'Sin categoría', icono: '📦', color: '#6B7280' };

      productosFiltrados.forEach(p => {
        const catId = p.categoria_id || 'none';
        if (!grupos[catId]) {
          grupos[catId] = {
            cat: categorias.find(c => c.id === p.categoria_id) || sinCat,
            items: []
          };
        }
        grupos[catId].items.push(p);
      });

      let html = '';
      Object.entries(grupos).forEach(([catId, grupo]) => {
        const collapsed = categoriasColapsadas.has(catId);
        const cat = grupo.cat;
        html += `
          <div class="category-section">
            <div class="category-header" onclick="toggleCategoria('${catId}')">
              <div class="cat-icon">${cat.icono}</div>
              <span class="cat-name">${cat.nombre}</span>
              <span class="cat-count">${grupo.items.filter(p=>!p.marcado).length}/${grupo.items.length}</span>
              <span class="cat-toggle ${collapsed ? 'collapsed' : ''}">▼</span>
            </div>
            ${collapsed ? '' : grupo.items.map(p => renderProducto(p)).join('')}
          </div>`;
      });

      main.innerHTML = html;
    }

    function renderProducto(p) {
      const qty = p.cantidad ? `<span class="prod-qty">${p.cantidad}${p.unidad ? ' ' + p.unidad : ''}</span>` : '';
      const notas = p.notas ? `<span class="prod-notes">· ${p.notas}</span>` : '';
      return `
        <div class="product-item ${p.marcado ? 'marcado' : ''}" id="prod-${p.id}">
          <button class="check-btn" onclick="toggleMarcado('${p.id}')">${p.marcado ? '✓' : ''}</button>
          <div class="prod-info">
            <div class="prod-name">${escHtml(p.nombre)}</div>
            <div class="prod-meta">${qty}${notas}</div>
          </div>
          <div class="prod-actions">
            <button class="prod-btn edit" onclick="editarProducto('${p.id}')">✏️</button>
            <button class="prod-btn del" onclick="eliminarProducto('${p.id}')">🗑</button>
          </div>
        </div>`;
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function toggleCategoria(catId) {
      if (categoriasColapsadas.has(catId)) {
        categoriasColapsadas.delete(catId);
      } else {
        categoriasColapsadas.add(catId);
      }
      renderLista();
    }

    function setFiltro(filtro, btn) {
      filtroActual = filtro;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      renderLista();
    }

    // ─── ACCIONES ───────────────────────────────────────────────────────────
    async function toggleMarcado(id) {
      const p = productos.find(x => x.id === id);
      if (!p) return;
      const newVal = !p.marcado;
      // Optimistic UI
      p.marcado = newVal;
      renderLista();
      try {
        await sbPatch('productos', id, { marcado: newVal });
      } catch (e) {
        p.marcado = !newVal;
        renderLista();
        mostrarToast('Error al guardar');
      }
    }

    async function eliminarProducto(id) {
      if (!confirm('¿Eliminar este producto?')) return;
      const idx = productos.findIndex(x => x.id === id);
      const prod = productos[idx];
      productos.splice(idx, 1);
      renderLista();
      try {
        await sbDelete('productos', id);
        mostrarToast('Producto eliminado');
      } catch (e) {
        productos.splice(idx, 0, prod);
        renderLista();
        mostrarToast('Error al eliminar');
      }
    }

    function editarProducto(id) {
      const p = productos.find(x => x.id === id);
      if (!p) return;
      document.getElementById('editId').value = p.id;
      document.getElementById('modalTitulo').textContent = 'Editar Producto';
      document.getElementById('inputNombre').value = p.nombre;
      document.getElementById('inputCantidad').value = p.cantidad || '';
      document.getElementById('inputUnidad').value = p.unidad || '';
      document.getElementById('selectCategoria').value = p.categoria_id || '';
      document.getElementById('inputNotas').value = p.notas || '';
      abrirModal();
    }

    // ─── MODAL CRUD ─────────────────────────────────────────────────────────
    function abrirModal() {
      document.getElementById('modalProducto').classList.remove('hidden');
      setTimeout(() => document.getElementById('inputNombre').focus(), 300);
    }

    function cerrarModal(id) {
      document.getElementById(id).classList.add('hidden');
      if (id === 'modalProducto') resetForm();
    }

    function resetForm() {
      document.getElementById('editId').value = '';
      document.getElementById('modalTitulo').textContent = 'Agregar Producto';
      document.getElementById('inputNombre').value = '';
      document.getElementById('inputCantidad').value = '';
      document.getElementById('inputUnidad').value = '';
      document.getElementById('selectCategoria').value = '';
      document.getElementById('inputNotas').value = '';
    }

    async function guardarProducto() {
      const nombre = document.getElementById('inputNombre').value.trim();
      if (!nombre) { mostrarToast('Escribe el nombre del producto'); return; }

      const editId = document.getElementById('editId').value;
      const data = {
        nombre,
        cantidad: document.getElementById('inputCantidad').value.trim(),
        unidad: document.getElementById('inputUnidad').value.trim(),
        categoria_id: document.getElementById('selectCategoria').value || null,
        notas: document.getElementById('inputNotas').value.trim(),
        updated_at: new Date().toISOString()
      };

      cerrarModal('modalProducto');

      try {
        if (editId) {
          await sbPatch('productos', editId, data);
          const idx = productos.findIndex(x => x.id === editId);
          if (idx >= 0) productos[idx] = { ...productos[idx], ...data };
          mostrarToast('✓ Producto actualizado');
        } else {
          const [nuevo] = await sbPost('productos', { ...data, marcado: false, orden: productos.length });
          productos.unshift(nuevo);
          mostrarToast('✓ Producto agregado');
        }
        renderLista();
      } catch (e) {
        console.error(e);
        mostrarToast('Error al guardar');
        await cargarDatos();
      }
    }

    // ─── COMPARTIR ──────────────────────────────────────────────────────────
    function generarTexto() {
      const hoy = new Date().toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
      let texto = `☕ *Lista Cafetería*\n📅 ${hoy}\n`;

      const pendientes = productos.filter(p => !p.marcado);
      const marcados = productos.filter(p => p.marcado);

      if (pendientes.length === 0 && marcados.length === 0) {
        return '☕ Lista vacía';
      }

      // Agrupar pendientes por categoría
      const grupos = {};
      pendientes.forEach(p => {
        const cat = categorias.find(c => c.id === p.categoria_id);
        const catKey = cat ? cat.nombre : 'Sin categoría';
        const catIcon = cat ? cat.icono : '📦';
        if (!grupos[catKey]) grupos[catKey] = { icono: catIcon, items: [] };
        grupos[catKey].items.push(p);
      });

      if (pendientes.length > 0) {
        texto += `\n🛒 *PENDIENTES (${pendientes.length})*\n`;
        Object.entries(grupos).forEach(([cat, g]) => {
          texto += `\n${g.icono} *${cat}*\n`;
          g.items.forEach(p => {
            const qty = p.cantidad ? ` — ${p.cantidad}${p.unidad ? ' ' + p.unidad : ''}` : '';
            const notas = p.notas ? ` _(${p.notas})_` : '';
            texto += `• ${p.nombre}${qty}${notas}\n`;
          });
        });
      }

      if (marcados.length > 0) {
        texto += `\n✅ *YA TENEMOS (${marcados.length})*\n`;
        marcados.forEach(p => texto += `✓ ${p.nombre}\n`);
      }

      texto += `\n_Generado con Lista Cafetería ☕_`;
      return texto;
    }

    function abrirCompartir() {
      const texto = generarTexto();
      document.getElementById('sharePreview').textContent = texto;
      document.getElementById('modalCompartir').classList.remove('hidden');
    }

    function compartirWhatsApp() {
      const texto = generarTexto();
      const url = `https://wa.me/?text=${encodeURIComponent(texto)}`;
      window.open(url, '_blank');
    }

    async function copiarTexto() {
      const texto = generarTexto();
      try {
        await navigator.clipboard.writeText(texto);
        mostrarToast('📋 Lista copiada');
      } catch {
        // Fallback
        const ta = document.createElement('textarea');
        ta.value = texto;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        mostrarToast('📋 Lista copiada');
      }
    }

    // ─── CONFIG ─────────────────────────────────────────────────────────────
    function abrirConfig() {
      document.getElementById('modalConfig').classList.remove('hidden');
    }

    async function desmarcarTodos() {
      if (!confirm('¿Desmarcar todos los productos?')) return;
      cerrarModal('modalConfig');
      productos.forEach(p => p.marcado = false);
      renderLista();
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/productos`, {
          method: 'PATCH',
          headers,
          body: JSON.stringify({ marcado: false })
        });
        mostrarToast('↩ Todos desmarcados');
      } catch { await cargarDatos(); }
    }

    async function eliminarMarcados() {
      const marcados = productos.filter(p => p.marcado);
      if (marcados.length === 0) { mostrarToast('No hay productos marcados'); return; }
      if (!confirm(`¿Eliminar ${marcados.length} productos marcados?`)) return;
      cerrarModal('modalConfig');
      productos = productos.filter(p => !p.marcado);
      renderLista();
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/productos?marcado=eq.true`, {
          method: 'DELETE', headers
        });
        mostrarToast(`🗑 ${marcados.length} productos eliminados`);
      } catch { await cargarDatos(); }
    }

    // ─── TOAST ──────────────────────────────────────────────────────────────
    function mostrarToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    // ─── CERRAR MODAL AL TOCAR AFUERA ────────────────────────────────────
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) cerrarModal(overlay.id);
      });
    });

    // ─── ENTER en input nombre ───────────────────────────────────────────
    document.getElementById('inputNombre').addEventListener('keydown', e => {
      if (e.key === 'Enter') guardarProducto();
    });

    // ─── SERVICE WORKER (PWA) ────────────────────────────────────────────
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      });
    }
  </script>
</body>
</html>
